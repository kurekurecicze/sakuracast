<!-- filters.html -->
<section class="filters">

  <div class="filter-group">
    <h4>Project Type</h4>
    <label><input type="checkbox" name="projectType" value="Game"> Game</label>
    <label><input type="checkbox" name="projectType" value="Anime"> Anime</label>
    <label><input type="checkbox" name="projectType" value="Commercial"> Commercial</label>
    <label><input type="checkbox" name="projectType" value="Audiobook"> Audiobook</label>
    <label><input type="checkbox" name="projectType" value="Animation"> Animation</label>
    <label><input type="checkbox" name="projectType" value="Podcast"> Podcast</label>
    <label><input type="checkbox" name="projectType" value="Other"> Other</label>
  </div>

  <div class="filter-group">
    <h4>Voice Type - Gender</h4>
    <label><input type="checkbox" name="voiceGender" value="Male"> Male</label>
    <label><input type="checkbox" name="voiceGender" value="Female"> Female</label>
    <label><input type="checkbox" name="voiceGender" value="Non-binary"> Non-binary</label>
  </div>

  <div class="filter-group">
    <h4>Accent / Dialect</h4>
    <strong>Europe</strong><br />
    <label><input type="checkbox" name="accent" value="British English"> British English</label>
    <label><input type="checkbox" name="accent" value="German"> German</label>
    <label><input type="checkbox" name="accent" value="Russian"> Russian</label>
    <label><input type="checkbox" name="accent" value="Czech"> Czech</label>
    <label><input type="checkbox" name="accent" value="French"> French</label>
    <label><input type="checkbox" name="accent" value="Spanish (Spain)"> Spanish (Spain)</label>
    <br />
    <strong>North America</strong><br />
    <label><input type="checkbox" name="accent" value="American English"> American English</label>
    <label><input type="checkbox" name="accent" value="Canadian English"> Canadian English</label>
    <label><input type="checkbox" name="accent" value="Mexican Spanish"> Mexican Spanish</label>
  </div>

  <div class="filter-group">
    <h4>Audio Length</h4>
    <label><input type="checkbox" name="audioLength" value="Short"> Short (up to 1 min)</label>
    <label><input type="checkbox" name="audioLength" value="Medium"> Medium (up to 5 min)</label>
    <label><input type="checkbox" name="audioLength" value="Long"> Long (5+ min)</label>
  </div>

  <div class="filter-group">
    <h4>Age Range</h4>
    <label><input type="checkbox" name="age" value="Child"> Child</label>
    <label><input type="checkbox" name="age" value="Teen"> Teen</label>
    <label><input type="checkbox" name="age" value="Young Adult"> Young Adult</label>
    <label><input type="checkbox" name="age" value="Adult"> Adult</label>
    <label><input type="checkbox" name="age" value="Middle-aged"> Middle-aged</label>
    <label><input type="checkbox" name="age" value="Senior"> Senior</label>
  </div>

  <div class="filter-group">
    <h4>Voice Style</h4>
    <label><input type="checkbox" name="style" value="Soft"> Soft</label>
    <label><input type="checkbox" name="style" value="Deep"> Deep</label>
    <label><input type="checkbox" name="style" value="Aggressive"> Aggressive</label>
    <label><input type="checkbox" name="style" value="Emotional"> Emotional</label>
    <label><input type="checkbox" name="style" value="Neutral"> Neutral</label>
    <label><input type="checkbox" name="style" value="Comic"> Comic</label>
    <label><input type="checkbox" name="style" value="Narration"> Narration</label>
  </div>

  <div class="filter-group">
    <h4>Availability</h4>
    <label><input type="checkbox" name="availability" value="Immediate"> Immediate</label>
    <label><input type="checkbox" name="availability" value="Within a week"> Within a week</label>
    <label><input type="checkbox" name="availability" value="Within a month"> Within a month</label>
    <label><input type="checkbox" name="availability" value="Negotiable"> Negotiable</label>
  </div>

  <button id="clear-filters" class="btn secondary">Clear Filters</button>
</section>
