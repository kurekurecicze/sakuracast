<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakuraCast</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#fff8fb;
            color:#333;
        }

        header{
            background:white;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:#e889b5;
        }

        nav a{
            margin-left:20px;
            text-decoration:none;
            color:#444;
            font-weight:600;
        }

        .hero{
            text-align:center;
            padding:120px 20px;
        }

        .hero h1{
            font-size:56px;
            margin-bottom:20px;
        }

        .hero p{
            font-size:20px;
            max-width:700px;
            margin:auto;
            color:#666;
        }

        .buttons{
            margin-top:40px;
        }

        .btn{
            display:inline-block;
            padding:14px 28px;
            margin:10px;
            border-radius:999px;
            text-decoration:none;
            font-weight:bold;
        }

        .primary{
            background:#e889b5;
            color:white;
        }

        .secondary{
            border:2px solid #e889b5;
            color:#e889b5;
        }

        footer{
            text-align:center;
            padding:40px;
            color:#777;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🌸 SakuraCast</div>

    <nav>
        <a href="#">Projects</a>
        <a href="#">Talent Search</a>
        <a href="#">Pricing</a>
        <a href="#">Login</a>
    </nav>
</header>

<section class="hero">
    <h1>Find Your Voice.</h1>

    <p>
        SakuraCast is a platform connecting voice actors,
        directors and creators through casting calls,
        auditions and professional networking.
    </p>

    <div class="buttons">
        <a class="btn primary" href="#">Join as Voice Actor</a>
        <a class="btn secondary" href="#">Create Project</a>
    </div>
</section>

<footer>
    © 2026 SakuraCast
</footer>

</body>
</html>
