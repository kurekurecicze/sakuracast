<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SakuraCast - Profile</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#fff7fb;
    color:#2b2b2b;
}

header{
    padding:18px 30px;
    background:white;
    display:flex;
    justify-content:space-between;

}

a{ text-decoration:none; color:#e889b5; font-weight:bold; }

.container{

.profile-card{

    padding:20px;

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#f3b6cc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    margin-bottom:10px;
}

.tag{
    display:inline-block;
    background:#f3b6cc;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    margin:3px;
}

button{
    background:#e889b5;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:999px;

    font-weight:bold;
    margin-top:10px;
}
