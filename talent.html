<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SakuraCast - Talent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">🌸 SakuraCast</a></div>

  <nav>
    <a href="projects.html">Projects</a>
  </nav>

  <button class="toggle" aria-label="Toggle Dark/Light Mode">🌙</button>
</header>

<main class="container">
  <h1>Talent Search</h1>

  <!-- Filtr se načte sem -->
  <div id="filter-container"></div>

  <section>
    <div class="grid" id="talent-list">

      <div class="card" data-gender="Female" data-age="Young Adult" data-accent="Japanese" data-style="Soft" data-availability="Immediate">
        <h3>Yuki VA</h3>
        <p>Japanese / English • Soft Anime Voices</p>
      </div>

      <div class="card" data-gender="Male" data-age="Adult" data-accent="American English" data-style="Deep" data-availability="Within a week">
        <h3>Max Stone</h3>
        <p>Deep male voice • Game characters</p>
      </div>

      <div class="card" data-gender="Female" data-age="Adult" data-accent="British English" data-style="Neutral" data-availability="Negotiable">
        <h3>Luna Rose</h3>
        <p>Commercial / soft voice</p>
      </div>

      <div class="card" data-gender="Non-binary" data-age="Middle-aged" data-accent="Czech" data-style="Emotional" data-availability="Within a month">
        <h3>Alex Novak</h3>
        <p>Versatile voice • Emotional roles</p>
      </div>

    </div>
  </section>

</main>

<footer>
  <p>© 2024 SakuraCast • Built with 🌸</p>
</footer>

<script>
// Načtení externího filtru z filters.html
document.addEventListener('DOMContentLoaded', () => {
  fetch('filters.html')
    .then(response => response.text())
    .then(html => {
      document.getElementById('filter-container').innerHTML = html;

      filterTalent();

      document.querySelectorAll('.filters input[type="checkbox"]').forEach(input => {
        input.addEventListener('change', filterTalent);
      });

      document.getElementById('clear-filters').addEventListener('click', () => {
        document.querySelectorAll('.filters input[type="checkbox"]').forEach(i => i.checked = false);
        filterTalent();
      });
    });
});

function filterTalent() {
  const talents = document.querySelectorAll('#talent-list .card');

  function getCheckedValues(name) {
    return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(i => i.value);
  }

  const selectedGenders = getCheckedValues('voiceGender').length ? getCheckedValues('voiceGender') : getCheckedValues('gender');
  const selectedAges = getCheckedValues('age');
  const selectedAccents = getCheckedValues('accent');
  const selectedStyles = getCheckedValues('style');
  const selectedAvailability = getCheckedValues('availability');

  talents.forEach(card => {
    const gender = card.getAttribute('data-gender');
    const age = card.getAttribute('data-age');
    const accent = card.getAttribute('data-accent');
    const style = card.getAttribute('data-style');
    const availability = card.getAttribute('data-availability');

    const matchesGender = selectedGenders.length === 0 || selectedGenders.includes(gender);
    const matchesAge = selectedAges.length === 0 || selectedAges.includes(age);
    const matchesAccent = selectedAccents.length === 0 || selectedAccents.includes(accent);
    const matchesStyle = selectedStyles.length === 0 || selectedStyles.includes(style);
    const matchesAvailability = selectedAvailability.length === 0 || selectedAvailability.includes(availability);

    card.style.display = matchesGender && matchesAge && matchesAccent && matchesStyle && matchesAvailability ? '' : 'none';
  });
}
</script>

<script src="script.js"></script>
</body>
</html>
