<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SakuraCast - Talent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">
    <a href="index.html" style="text-decoration:none; color:inherit;">🌸 SakuraCast</a>
  </div>

  <nav>
    <a href="projects.html">Projects</a>
  </nav>

  <button class="toggle" aria-label="Toggle Dark/Light Mode">🌙</button>
</header>

<main class="container">
  <h1>Talent Search</h1>

  <div id="filter-container"></div>

  <section class="grid" id="talent-list">

    <div class="card" data-gender="Female" data-age="Young Adult" data-accent="Japanese" data-style="Soft" data-availability="Immediate">
      <h3>Yuki VA</h3>
      <p>Japanese / English • Soft Anime Voices</p>
    </div>

    <div class="card" data-gender="Male" data-age="Adult" data-accent="American English" data-style="Deep" data-availability="Within a week">
      <h3>Max Stone</h3>
      <p>Deep male voice • Game characters</p>
    </div>

    <div class="card" data-gender="Female" data-age="Adult" data-accent="British English" data-style="Neutral" data-availability="Negotiable">
      <h3>Luna Rose</h3>
      <p>Commercial / soft voice</p>
    </div>

    <div class="card" data-gender="Non-binary" data-age="Middle-aged" data-accent="Czech" data-style="Emotional" data-availability="Within a month">
      <h3>Alex Novak</h3>
      <p>Versatile voice • Emotional roles</p>
    </div>

  </section>
</main>

<footer>
  <p>© 2024 SakuraCast • Built with 🌸</p>
</footer>

<script src="script.js"></script>
