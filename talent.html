<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SakuraCast - Talent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">🌸 SakuraCast</a></div>

  <nav>
    <a href="projects.html">Projects</a>
  </nav>

  <button class="toggle" aria-label="Toggle Dark/Light Mode">🌙</button>
</header>

<main class="container">
  <h1>Talent Search</h1>

  <div id="filter-container"></div>

  <section class="grid" id="talent-list">

    <div class="card" data-gender="Female" data-age="Young Adult" data-accent="Japanese" data-style="Soft" data-availability="Immediate">
      <h3>Yuki VA</h3>
      <p>Japanese / English • Soft Anime Voices</p>
    </div>

    <div class="card" data-gender="Male" data-age="Adult" data-accent="American English" data-style="Deep" data-availability="Within a week">
      <h3>Max Stone</h3>
      <p>Deep male voice • Game characters</p>
    </div>

    <div class="card" data-gender="Female" data-age="Adult" data-accent="British English" data-style="Neutral" data-availability="Negotiable">
      <h3>Luna Rose</h3>
      <p>Commercial / soft voice</p>
    </div>

    <div class="card" data-gender="Non-binary" data-age="Middle-aged" data-accent="Czech" data-style="Emotional" data-availability="Within a month">
      <h3>Alex Novak</h3>
      <p>Versatile voice • Emotional roles</p>
    </div>

  </section>
</main>

<footer>
  <p>© 2024 SakuraCast • Built with 🌸</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  fetch('filters.html')
    .then(response => response.text())
    .then(html => {
      document.getElementById('filter-container').innerHTML = html;

      document.querySelectorAll('.filters-tabbar .filter-buttons button').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          filterTalent();
        });
      });

      const clearBtn = document.getElementById('clear-filters');
      if(clearBtn){
        clearBtn.addEventListener('click', () => {
          document.querySelectorAll('.filters-tabbar .filter-buttons button.active').forEach(b => b.classList.remove('active'));
          filterTalent();
        });
      }

      filterTalent();
    });
});

function filterTalent() {
  const talents = document.querySelectorAll('#talent-list .card');

  const activeFilters = {};
  document.querySelectorAll('.filters-tabbar .filter-buttons').forEach(group => {
    const filterName = group.getAttribute('data-filter-name');
    activeFilters[filterName] = Array.from(group.querySelectorAll('button.active')).map(b => b.getAttribute('data-filter-value'));
  });

  talents.forEach(talent => {
    let visible = true;
    for(let key in activeFilters){
      if(activeFilters[key].length === 0) continue;
      let dataKey = key.toLowerCase();
      if(key === 'voiceGender') dataKey = 'gender';

      const val = talent.getAttribute('data-' + dataKey);

      if(!activeFilters[key].includes(val)){
        visible = false;
        break;
      }
    }
    talent.style.display = visible ? '' : 'none';
  });
}
</script>

<script src="script.js"></script>
</body>
</html>
