<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SakuraCast - Project</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🌸 SakuraCast</div>

    <nav>
        <a href="projects.html">Back to Projects</a>
    </nav>

    <button class="toggle" onclick="toggleTheme()">🌙</button>
</header>

<div class="container">

    <h1>🌸 Sakura Spirits</h1>

    <p class="subtitle">
        Anime fantasy project about spirits of cherry blossoms and emotional storytelling.
    </p>

    <div class="card">
        <div class="tag">Role</div>

        <h2>Yumi - Main Character</h2>

        <p>Soft emotional female voice, age 16–20.</p>

        <button class="btn primary" onclick="apply('Yumi')">
            Apply for this role
        </button>
    </div>

    <div class="card">
        <div class="tag">Role</div>

        <h2>Guardian Spirit</h2>

        <p>Deep calm male voice, mystical tone.</p>

        <button class="btn primary" onclick="apply('Guardian Spirit')">
            Apply for this role
        </button>
    </div>

</div>

<script>
function apply(role){
    alert("Audition submitted for role: " + role + " 🌸 (demo version)");
}
</script>

<script src="script.js"></script>

</body>
</html>
