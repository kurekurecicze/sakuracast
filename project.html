<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SakuraCast - Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">
    <a href="index.html" style="text-decoration:none; color:inherit;">🌸 SakuraCast</a>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="talent.html">Talent Search</a>
    <a href="profile.html" id="profile-link" style="display:none;">My Profile</a>
  </nav>

  <div class="auth-buttons" id="auth-buttons">
    <a href="register.html" class="btn primary">Register</a>
    <a href="login.html" class="btn secondary">Login</a>
  </div>

  <div class="auth-buttons" id="user-buttons" style="display:none;">
    <button id="logout-btn" class="btn secondary">Logout</button>
  </div>

  <button class="toggle" aria-label="Toggle Dark/Light Mode">🌙</button>
</header>

<main class="container">

  <h1>🌸 Sakura Spirits</h1>
  <p class="subtitle">
    Anime fantasy project about spirits of cherry blossoms and emotional storytelling.
  </p>

  <div class="card">
    <div class="tag">Role</div>
    <h2>Yumi - Main Character</h2>
    <p>Soft emotional female voice, age 16–20.</p>
    <button class="btn primary" onclick="apply('Yumi')">Apply for this role</button>
  </div>

  <div class="card">
    <div class="tag">Role</div>
    <h2>Guardian Spirit</h2>
    <p>Deep calm male voice, mystical tone.</p>
    <button class="btn primary" onclick="apply('Guardian Spirit')">Apply for this role</button>
  </div>

</main>

<script>
function apply(role){
  alert("Audition submitted for role: " + role + " 🌸 (demo version)");
}
</script>

<script src="script.js"></script>
</body>
</html>
