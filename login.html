<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SakuraCast - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">
    <a href="index.html" style="text-decoration:none; color:inherit;">🌸 SakuraCast</a>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="talent.html">Talent Search</a>
    <a href="profile.html" id="profile-link" style="display:none;">My Profile</a>
  </nav>

  <div class="auth-buttons" id="auth-buttons">
    <a href="register.html" class="btn primary">Register</a>
    <a href="login.html" class="btn secondary">Login</a>
  </div>

  <div class="auth-buttons" id="user-buttons" style="display:none;">
    <button id="logout-btn" class="btn secondary">Logout</button>
  </div>

  <button class="toggle" aria-label="Toggle Dark/Light Mode">🌙</button>
</header>

<main class="container">
  <h1>Login</h1>
  <form id="login-form">
    <label for="email">Email or Username</label><br />
    <input type="text" id="email" name="email" required /><br /><br />

    <label for="password">Password</label><br />
    <input type="password" id="password" name="password" required /><br /><br />

    <button type="submit" class="btn primary">Login</button>
  </form>

  <p style="margin-top:20px;">
    Don't have an account? <a href="register.html">Register here</a>.
  </p>
</main>

<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  alert('Login successful! (demo version)');
  window.location.href = 'dashboard.html';
});
</script>

<script src="script.js"></script>
</body>
</html>
